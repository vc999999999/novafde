<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NovaFDE · 浅色系强调色对比</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --bg-2:#FAFAF9; --bg-3:#F4F4F2;
    --ink:#18181B; --ink-2:#52525B; --ink-3:#A1A1AA;
    --line:#EAEAE8; --line-2:#E0E0DD;
    --ok:#15803D; --ok-soft:rgba(21,128,61,.10);
    --warn:#B45309; --err:#B91C1C;
    /* 当前强调色(JS 实时替换) */
    --accent:#0E7C73;
    --accent-soft:rgba(14,124,115,.10);
    --accent-line:rgba(14,124,115,.30);
    --sans:"Inter","PingFang SC",-apple-system,"Helvetica Neue",sans-serif;
    --r-sm:8px; --r-md:12px; --r-full:999px;
  }
  *{box-sizing:border-box; margin:0;}
  body{ font-family:var(--sans); color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; line-height:1.55; letter-spacing:-.005em;}
  .wrap{ max-width:1060px; margin:0 auto; padding:64px 28px 90px;}

  .kicker{ font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); font-weight:600; transition:color .3s;}
  h1{ font-size:clamp(34px,5vw,52px); font-weight:600; letter-spacing:-.03em; line-height:1.04; margin:16px 0 0;}
  .lede{ font-size:17px; color:var(--ink-2); max-width:560px; margin-top:16px;}

  .label-row{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); font-weight:600; margin:54px 0 16px; display:flex; align-items:center; gap:14px;}
  .label-row::after{ content:""; height:1px; flex:1; background:var(--line);}

  /* —— 色卡选择器 —— */
  .picker{ display:grid; grid-template-columns:repeat(6,1fr); gap:12px; }
  .opt{ cursor:pointer; border:1px solid var(--line); border-radius:var(--r-md); padding:14px; background:var(--bg); transition:all .2s; text-align:left;}
  .opt:hover{ border-color:var(--ink-3); transform:translateY(-2px);}
  .opt.on{ border-color:var(--ink); box-shadow:0 0 0 1px var(--ink);}
  .opt .dot{ width:100%; height:40px; border-radius:var(--r-sm); margin-bottom:10px;}
  .opt b{ font-size:12.5px; font-weight:600; display:block;}
  .opt span{ font-size:10.5px; color:var(--ink-3);}
  .opt .rec{ font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-top:4px; display:inline-block;}

  /* —— 预览卡 —— */
  .preview{ margin-top:18px; border:1px solid var(--line); border-radius:16px; background:var(--bg); overflow:hidden; box-shadow:0 1px 2px rgba(24,24,27,.04), 0 8px 24px -14px rgba(24,24,27,.16);}
  .pv-top{ display:flex; align-items:center; justify-content:space-between; padding:14px 22px; border-bottom:1px solid var(--line);}
  .logo{ font-size:17px; font-weight:700; letter-spacing:-.02em;} .logo span{ color:var(--ink-3); font-weight:500;}
  .nav{ display:flex; gap:1px; background:var(--bg-3); padding:3px; border-radius:var(--r-full);}
  .nav button{ font-family:var(--sans); font-size:12.5px; color:var(--ink-2); cursor:pointer; border:0; background:transparent; padding:6px 14px; border-radius:var(--r-full); font-weight:500;}
  .nav button.active{ background:var(--bg); color:var(--ink); box-shadow:0 1px 2px rgba(24,24,27,.08);}

  .pv-body{ display:grid; grid-template-columns:200px 1fr;}
  .pv-rail{ border-right:1px solid var(--line); padding:26px; background:var(--bg-2); display:flex; flex-direction:column; align-items:center; gap:14px;}
  .ring{ position:relative; width:96px; height:96px;}
  .ring svg{ transform:rotate(-90deg);}
  .ring .pct{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ring .pct b{ font-size:27px; font-weight:600; letter-spacing:-.02em;}
  .ring .pct small{ font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:600; margin-top:2px;}
  .step{ width:100%; display:flex; gap:10px; align-items:center; padding:9px 11px; border-radius:10px;}
  .step.active{ background:var(--bg); box-shadow:inset 0 0 0 1px var(--line-2);}
  .step .idx{ width:23px; height:23px; border-radius:50%; display:grid; place-items:center; font-size:11px; font-weight:600; border:1px solid var(--line-2); color:var(--ink-3); background:var(--bg);}
  .step.done .idx{ background:var(--ink); border-color:var(--ink); color:#fff;}
  .step.active .idx{ border-color:var(--accent); color:var(--accent);}
  .step b{ font-size:12.5px; font-weight:600;}

  .pv-panel{ padding:30px 34px;}
  .eyebrow{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); font-weight:600; transition:color .3s;}
  .pv-panel h2{ font-size:26px; font-weight:600; letter-spacing:-.025em; margin:8px 0 16px;}
  .field-label{ font-size:12.5px; font-weight:600; margin-bottom:8px;}
  .input{ width:100%; font-family:var(--sans); font-size:14px; color:var(--ink); background:var(--bg); border:1px solid var(--line-2); border-radius:var(--r-md); padding:11px 13px; transition:all .2s;}
  .input::placeholder{ color:var(--ink-3);}
  .input.focus{ border-color:var(--accent-line); box-shadow:0 0 0 4px var(--accent-soft);}
  .chips{ display:flex; gap:8px; flex-wrap:wrap; margin-top:16px;}
  .chip{ font-size:12.5px; padding:7px 14px; border-radius:var(--r-full); border:1px solid var(--line-2); background:var(--bg); color:var(--ink-2); font-weight:500; cursor:pointer;}
  .chip.sel{ background:var(--accent); color:#fff; border-color:var(--accent);}
  .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:22px;}
  .btn{ font-family:var(--sans); font-size:13.5px; font-weight:600; cursor:pointer; padding:10px 20px; border-radius:var(--r-md); border:1px solid transparent; display:inline-flex; align-items:center; gap:8px; transition:all .2s;}
  .btn-primary{ background:var(--accent); color:#fff;}
  .btn-primary:hover{ filter:brightness(.94); transform:translateY(-1px);}
  .btn-ink{ background:var(--ink); color:#fff;}
  .btn-ghost{ background:transparent; color:var(--ink-2); border-color:var(--line-2);}
  .link{ color:var(--accent); font-size:13px; font-weight:600; cursor:pointer;}
  .pills{ display:flex; gap:8px; flex-wrap:wrap; margin-top:18px;}
  .pill{ font-size:11.5px; padding:4px 11px; border-radius:var(--r-full); border:1px solid var(--accent-line); background:var(--accent-soft); color:var(--accent); font-weight:500;}

  .note{ margin-top:18px; font-size:13px; color:var(--ink-2); background:var(--bg-2); border:1px solid var(--line); border-radius:var(--r-md); padding:14px 16px; line-height:1.6;}
  .note b{ color:var(--ink);}
  @media (max-width:860px){ .picker{grid-template-columns:repeat(3,1fr);} .pv-body{grid-template-columns:1fr;} .pv-rail{border-right:0; border-bottom:1px solid var(--line);} }
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker" id="kicker">浅色系 · 强调色对比</div>
  <h1>给浅色版挑一个更搭的焦点色</h1>
  <p class="lede">点上方任意色卡,下面整套界面的强调色会实时切换。浅色极简通常偏向更冷或更收敛的单色,克制是关键。</p>

  <div class="label-row">点击切换强调色</div>
  <div class="picker" id="picker"></div>

  <div class="label-row">实时预览</div>
  <div class="preview">
    <div class="pv-top">
      <div class="logo">Nova<span>FDE</span></div>
      <nav class="nav">
        <button class="active">创建</button><button>历史</button><button>规则</button><button>设置</button>
      </nav>
    </div>
    <div class="pv-body">
      <div class="pv-rail">
        <div class="ring">
          <svg width="96" height="96">
            <circle cx="48" cy="48" r="42" fill="none" stroke="#EAEAE8" stroke-width="5"/>
            <circle id="ringArc" cx="48" cy="48" r="42" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="92.4"/>
          </svg>
          <div class="pct"><b>65</b><small>完成度</small></div>
        </div>
        <div class="step done"><span class="idx">✓</span><b>基础信息</b></div>
        <div class="step active"><span class="idx">2</span><b>用途</b></div>
        <div class="step"><span class="idx">3</span><b>知识</b></div>
      </div>
      <div class="pv-panel">
        <div class="eyebrow">步骤 02 / 04</div>
        <h2>用途</h2>
        <div class="field-label">使用时机</div>
        <input class="input focus" value="当用户上传一份财报 PDF,需要提取关键指标时……" />
        <div class="chips">
          <span class="chip sel">专业严谨</span><span class="chip">简洁直接</span><span class="chip">亲切口语</span>
        </div>
        <div class="pills">
          <span class="pill">● 已连接</span><span class="pill">● 草稿已保存</span>
        </div>
        <div class="row">
          <button class="btn btn-primary">继续 →</button>
          <button class="btn btn-ghost">上一步</button>
          <span class="link">查看 Skill 规范 →</span>
        </div>
        <div class="note" id="note"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const ACCENTS = [
    { name:'松石青', hex:'#0E7C73', desc:'冷静专业,科技感', rec:true,
      note:'<b>松石青(推荐)</b>——冷而不锐,在纯白上干净、专业,带一点克制的科技感。适合工具型产品,最稳妥的浅色搭配。' },
    { name:'石板蓝', hex:'#475A73', desc:'最收敛,沉稳', rec:false,
      note:'<b>石板蓝</b>——几乎是带蓝的中性灰,最低调。想要"近乎无彩、极致冷静"时选它,焦点色几乎隐于背景。' },
    { name:'靛蓝', hex:'#4751C4', desc:'经典,可信赖', rec:false,
      note:'<b>靛蓝</b>——经典的 SaaS 蓝紫,辨识度高、值得信赖。比松石青更"标准互联网产品",略微抢眼一些。' },
    { name:'森林绿', hex:'#2F7D52', desc:'自然,踏实', rec:false,
      note:'<b>森林绿</b>——沉稳的自然绿,温和踏实。注意它和"成功"状态色同属绿系,需在状态色上做区分。' },
    { name:'陶土橙', hex:'#BC6A45', desc:'保留暖意,更轻', rec:false,
      note:'<b>陶土橙</b>——比原琥珀金更轻、更现代的暖色。如果你舍不得暖调,这是浅色版里最和谐的暖色选择。' },
    { name:'墨黑(无彩)', hex:'#1A1A1A', desc:'最极简', rec:false,
      note:'<b>墨黑 / 无彩</b>——完全不用彩色,强调全靠黑白与留白(Linear / Vercel 浅色风)。最极简,但少了一点记忆点。' },
  ];

  function hexToRgba(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }

  const picker = document.getElementById('picker');
  ACCENTS.forEach((a,i)=>{
    const el = document.createElement('button');
    el.className = 'opt' + (i===0?' on':'');
    el.innerHTML = `<div class="dot" style="background:${a.hex}"></div><b>${a.name}</b><span>${a.hex}</span>${a.rec?'<span class="rec">推荐</span>':''}`;
    el.onclick = ()=>apply(i);
    picker.appendChild(el);
  });

  function apply(i){
    const a = ACCENTS[i];
    const r = document.documentElement.style;
    r.setProperty('--accent', a.hex);
    r.setProperty('--accent-soft', hexToRgba(a.hex,.10));
    r.setProperty('--accent-line', hexToRgba(a.hex,.30));
    document.querySelectorAll('.opt').forEach((o,j)=>o.classList.toggle('on', i===j));
    document.getElementById('note').innerHTML = a.note;
  }
  apply(0);

  // 选项轻交互
  document.querySelectorAll('.chips .chip').forEach(c=>c.onclick=()=>{
    document.querySelectorAll('.chips .chip').forEach(x=>x.classList.remove('sel')); c.classList.add('sel');
  });
  document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active')); b.classList.add('active');
  });
</script>
</body>
</html>
